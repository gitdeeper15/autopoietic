# =============================================================
# STRATIM — Simulation Parameters
# File: SIMULATION/configs/parameters.yaml
# Version: 0.1.0-protocol
# =============================================================
#
# Default parameters for the data generating process (00_dgp.R).
# These values define the "true" model used in simulation. They
# are NOT estimated from data; they are chosen to reflect
# plausible effect sizes and design characteristics described
# in the protocol (Sections 3, 6, 7).
#
# When running parameter recovery or power surfaces, these
# values are used as the reference. The pre-registration
# should state which values are considered primary and which
# are explored in sensitivity analysis.
#
# =============================================================

# --- Fixed effects (standardized scale) ---
fixed_effects:
  phi:     0.50    # autoregressive coefficient (SIC stability)
  alpha_0: 0.20    # population mean sensitivity to closure exposure
  beta:    0.15    # rehearsal main effect
  gamma:   0.10    # recovery main effect
  delta_1: 0.05    # E x R interaction
  delta_2: 0.03    # E^2 x R interaction
  eta:     0.04    # E x G interaction

# --- Random effects ---
random_effects:
  sigma_alpha: 0.10   # SD of individual sensitivity deviations
  sigma_u:     0.30   # SD of individual intercepts
  sigma_eps:   0.20   # residual SD

# --- Design ---
design:
  N:         300       # target sample size
  n_months:  18        # total observation window
  waves:     [0, 6, 12, 18]   # principal measurement waves
  attrition: 0.20      # expected cumulative attrition

# --- Kernel ---
kernel:
  primary:  "exponential"   # used for primary DGP
  lambda:   0.30            # exponential decay rate
  comparison:
    powerlaw:
      rho: 1.50             # power-law exponent
    # 01_H5_identifiability.R explores a grid around these values.

# --- Baseline ---
baseline:
  SIC_sd_0: 1.0    # SD of baseline SIC

# --- Parameter grid for power surface (03_power_surface.R) ---
power_grid:
  N:                [200, 300, 400, 500, 600]
  effect_E:         [0.10, 0.20, 0.30, 0.40]   # alpha_0
  effect_ER:        [0.05, 0.10, 0.15, 0.20]   # delta_1
  sigma_alpha2:     [0.01, 0.05, 0.10]         # sigma_alpha^2
  attrition:        [0.10, 0.20]
  n_rep_per_cell:   20     # increase to 100+ for final pre-registration

# --- Kernel identifiability grid (01_H5_identifiability.R) ---
identifiability_grid:
  lambda: [0.10, 0.30, 0.50, 1.00]
  rho:    [0.50, 1.00, 1.50, 2.50]
  n_rep:  200

# --- Recovery study (02_parameter_recovery.R) ---
recovery:
  n_sim: 50   # increase to 200+ for final results
