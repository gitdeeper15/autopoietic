# STRATIM pre-commit configuration
# Version: 0.1.0-protocol
# Date: 2026-09
#
# Hooks are grouped by language. R hooks are active only when R files
# exist. Python hooks are active only when Python files exist.

repos:
  # ----------------------------------------------------------------
  # General file hygiene
  # ----------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/|data/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/|data/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ----------------------------------------------------------------
  # Python — formatting, imports, linting, types
  # ----------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  # ----------------------------------------------------------------
  # R — formatting and linting (active only if R files exist)
  # ----------------------------------------------------------------
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.2
    hooks:
      - id: style-files
        args: [--style_pkg=styler, --style_fun=tidyverse_style]
        files: \.R$
      - id: lintr
        files: \.R$
        args: [--warn_only]
      - id: parsable-R
      - id: no-browser-statement
      - id: deps-in-desc
        files: \.R$
        exclude: ^SIMULATION/code/

  # ----------------------------------------------------------------
  # Markdown — linting
  # ----------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, MD033, MD041]
        exclude: ^(LICENSE|CHANGELOG.md)

  # ----------------------------------------------------------------
  # YAML — linting
  # ----------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--format, parsable, --strict]
        files: \.(yml|yaml)$
        exclude: ^(\.gitlab-ci\.yml)$

  # ----------------------------------------------------------------
  # Shell — linting (active only if shell scripts exist)
  # ----------------------------------------------------------------
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.9.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: ^scripts/.*\.sh$

  # ----------------------------------------------------------------
  # Local STRATIM-specific checks
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-stratim-structure
        name: Check STRATIM structure
        entry: bash -c 'test -f README.md && test -f VERSION && test -f RESEARCH_PAPER/STRATIM_Research_Paper.md && test -f LICENSE && test -f CITATION.cff'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: check-no-empirical-data
        name: Ensure no raw participant data is committed
        entry: bash -c 'if [ -d DATA/raw ] && find DATA/raw -type f -not -name ".gitkeep" | grep -q .; then echo "ERROR - DATA/raw/ contains files; participant data must not be committed"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: check-no-large-binaries
        name: Ensure no large data files are committed
        entry: bash -c 'find . -type f \( -name "*.rds" -o -name "*.RDS" -o -name "*.parquet" -o -name "*.h5" \) -not -path "./.git/*" -not -path "./tests/fixtures/*" -size +5M | head -5 | while read f; do echo "WARNING - large file $f"; done; exit 0'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: check-paper-sections
        name: Check that paper sections are present
        entry: bash -c 'grep -q "^# Strategic Imagination Capacity" RESEARCH_PAPER/STRATIM_Research_Paper.md && grep -q "^## 10. Conclusion" RESEARCH_PAPER/STRATIM_Research_Paper.md'
        language: system
        pass_filenames: false
        files: ^STRATIM_Research_Paper\.md$
