# Autopoietic Code Rewriting — pre-commit configuration
# Version: 0.1.0-research-draft
# Date: 2026-10-31
#
# Python-only project. R and Shell hooks removed.

repos:
  # ----------------------------------------------------------------
  # General file hygiene
  # ----------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/|data/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/|data/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ----------------------------------------------------------------
  # Python — formatting, imports, linting, types
  # ----------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=88]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        args: [--ignore-missing-imports]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  # ----------------------------------------------------------------
  # Markdown — linting
  # ----------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, MD033, MD041]
        exclude: ^(LICENSE|CHANGELOG.md)

  # ----------------------------------------------------------------
  # YAML — linting
  # ----------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--format, parsable, --strict]
        files: \.(yml|yaml)$
        exclude: ^(\.gitlab-ci\.yml)$

  # ----------------------------------------------------------------
  # Local project-specific checks
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-project-structure
        name: Check project structure
        entry: bash -c 'test -f README.md && test -f VERSION && test -f LICENSE && test -f CITATION.cff && test -f CHANGELOG.md && test -f AUTHORS.md && test -f CONTRIBUTING.md'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: check-version-format
        name: Check VERSION format
        entry: bash -c 'V=$(cat VERSION); echo "$V" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+-(research-draft|implementation|pilot)$|^[0-9]+\.[0-9]+\.[0-9]+$" || (echo "ERROR - VERSION format: $V"; exit 1)'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: check-core-directories
        name: Check core directories exist
        entry: bash -c 'test -d core && test -d invariants && test -d sandbox && test -d tests && test -d docs'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: check-no-large-data
        name: Ensure no large data files are committed
        entry: bash -c 'find . -type f \( -name "*.json" -o -name "*.csv" -o -name "*.parquet" \) -not -path "./.git/*" -not -path "./tests/fixtures/*" -size +5M | head -5 | while read f; do echo "WARNING - large file $f"; done; exit 0'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
