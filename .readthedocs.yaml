# Autopoietic Code Rewriting — Read the Docs configuration
# Version: 0.1.0-research-draft
# Date: 2026-10-31
#
# NOTE: Documentation source (docs/) currently contains specification files
# (invariants_spec.md, experiment_protocol.md, decision_rules.md).
# Sphinx conf.py will be added in a later phase.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_build:
      - echo "Building Autopoietic Code Rewriting documentation (research-draft stage)"
      - echo "Version: 0.1.0-research-draft"
      - if [ -d docs ]; then echo "docs/ found"; else echo "docs/ not yet created — build will use README"; fi

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev

sphinx:
  configuration: docs/conf.py
  builder: html
  # Do not fail the build on warnings during research-draft stage
  fail_on_warning: false

formats:
  - pdf
  - htmlzip

# Submodules are not used
submodules:
  include: []
  recursive: false

search:
  ranking:
    invariants/*: 5
    experiment/*: 5
    decision/*: 4
    architecture/*: 4
    implementation/*: 3
    limitations/*: 3

redirects:
  index: README.md
