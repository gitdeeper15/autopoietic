# .readthedocs.yaml
# Read the Docs configuration file for STRATIM
# Version: 0.1.0-protocol
# Date: 2026-09
#
# NOTE: STRATIM is at the protocol stage. Documentation source (docs/)
# does not yet exist. This configuration is set up so that when docs/
# is created, Read the Docs will build it automatically.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    # R is not required for documentation build itself;
    # only for rendering R-based outputs embedded in docs.
  jobs:
    pre_build:
      - echo "Building STRATIM documentation (protocol stage)"
      - echo "Version: 0.1.0-protocol"
      - if [ -d docs ]; then echo "docs/ found"; else echo "docs/ not yet created — build will use README"; fi

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev

sphinx:
  configuration: docs/conf.py
  builder: html
  # Do not fail the build on warnings during protocol stage
  fail_on_warning: false

formats:
  - pdf
  - htmlzip

# Submodules are not used
submodules:
  include: []
  recursive: false

search:
  ranking:
    protocol/*: 5
    hypotheses/*: 4
    design/*: 4
    analysis/*: 4
    limitations/*: 3
    simulation/*: 3

redirects:
  index: README.md
