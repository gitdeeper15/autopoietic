[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "stratim"
dynamic = ["version"]
description = "STRATIM: A Dynamic State-Space Model of Strategic Imagination Capacity under Chronic Material Pressure"
readme = "README.md"
authors = [
    {name = "Samir Baladi", email = "gitdeeper@gmail.com"},
]
maintainers = [
    {name = "Samir Baladi", email = "gitdeeper@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: R",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Psychology",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.9.0",
    "pre-commit>=2.0.0",
    "isort>=5.12.0",
]
instruments = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]
dashboard = [
    "streamlit>=1.20.0",
    "plotly>=5.13.0",
]

[project.urls]
Homepage = "https://gitlab.com/gitdeeper15/STRATIM"
Documentation = "https://gitlab.com/gitdeeper15/STRATIM/-/blob/main/README.md"
Repository = "https://gitlab.com/gitdeeper15/STRATIM"
Issues = "https://gitlab.com/gitdeeper15/STRATIM/-/issues"
Paper = "https://gitlab.com/gitdeeper15/STRATIM/-/blob/main/RESEARCH_PAPER/STRATIM_Research_Paper.md"

# Console scripts are not yet active — STRATIM is at protocol stage.
# They will be enabled once the package modules are written.
# [project.scripts]
# stratim-simulate = "stratim.cli:simulate"
# stratim-validate = "stratim.cli:validate"

[tool.setuptools_scm]
write_to = "src/stratim/_version.py"
fallback_version = "0.1.0-protocol"

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "simulation: marks simulation tests (R / Stan)",
    "instrument: marks instrument tests",
]

[tool.coverage.run]
source = ["src/stratim"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "pass",
]
show_missing = true
skip_covered = true
